name: Bug report
description: Report reproducible behavior that differs from expectation.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Please remove secrets and personal data before submitting."
  - type: textarea
    id: behavior
    attributes: { label: What happened?, description: Include expected and actual behavior. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Steps to reproduce, placeholder: "1. ..." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Commit, release, or environment }
